name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  msix:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build signed MSIX
        run: >
          dotnet build CmdPalPomodoro.sln
          -c Release
          -p:Platform=${{ matrix.arch }}
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageDir=${{ github.workspace }}\AppPackages\${{ matrix.arch }}\

      - uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.arch }}
          path: AppPackages/**/*.msix

  installer:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace "^v", ""
          ./installer/build-exe.ps1 -Version $version -Platforms @("${{ matrix.arch }}")

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: dist/*.exe

  release:
    needs: [msix, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
